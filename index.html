<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#121214" />
  <title>Kidphone · Iniciar sesión o registrarse</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/auth.css" />
  
</head>
<body class="auth-page">

  <main>
    <section class="card" aria-labelledby="auth-title">
      <img class="logo" src="A KIDPHONE2.0.png" alt="Kidphone" width="325" />
      <h1 id="auth-title" class="sr-only">Acceder a Kidphone</h1>

      <div class="seg" id="seg" data-mode="login" role="tablist" aria-label="Modo de acceso">
        <span class="seg__thumb" aria-hidden="true"></span>
        <button type="button" role="tab" id="tab-login" aria-selected="true" aria-controls="auth-form">Iniciar sesión</button>
        <button type="button" role="tab" id="tab-register" aria-selected="false" aria-controls="auth-form" tabindex="-1">Registrarse</button>
      </div>

      <p class="badge">Con protección de datos ✔</p>

      <form id="auth-form" novalidate aria-labelledby="tab-login">
        <label class="field">
          <span class="sr-only">Email o número de teléfono</span>
          <input type="text" id="email" name="email" inputmode="email" autocomplete="username"
                 placeholder="Email o Número de teléfono" required />
        </label>

        <div class="field field--password">
          <label class="sr-only" for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password"
                 placeholder="Contraseña" required />
          <button type="button" class="peek" id="peek" aria-pressed="false" aria-label="Mostrar contraseña">
            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 3l18 18" /><path d="M10.6 5.1A10.4 10.4 0 0112 5c6.4 0 10 7 10 7a17 17 0 01-3.2 4M6.3 6.4C3.7 8.2 2 12 2 12s3.6 7 10 7c1.8 0 3.4-.5 4.8-1.2" /><path d="M9.9 9.9a3 3 0 004.2 4.2" />
            </svg>
          </button>
        </div>

        <p class="msg" id="msg" role="status" aria-live="polite" hidden></p>

        <button type="submit" class="btn" id="submit">
          <span class="btn__label">Continuar</span>
          <span class="btn__spinner" aria-hidden="true"></span>
        </button>
      </form>

      <div class="divider"><span>Registro rápido con</span></div>

      <div class="social">
        <button type="button" aria-label="Apple"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/apple.svg" alt="" /></button>
        <button type="button" aria-label="Google"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/google.svg" alt="" /></button>
        <button type="button" aria-label="Facebook"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/facebook.svg" alt="" /></button>
        <button type="button" aria-label="X"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/x.svg" alt="" /></button>
      </div>

      <p class="location">🌍 Localización: <strong>Panamá</strong></p>
      <p class="terms">Al continuar aceptas nuestros términos.</p>
    </section>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
