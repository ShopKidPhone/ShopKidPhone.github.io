<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registro / Inicio de sesión</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .modal {
      background: linear-gradient(to bottom right, #ffffff, #c0c0c0);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      width: 90%;
      max-width: 400px;
      padding: 30px 25px;
      text-align: center;
      position: relative;
      box-sizing: border-box;
    }

    .modal img.logo {
      width: 325px;
      max-width: 100%;
      height: auto;
      margin-bottom: 10px;
    }

    .modal h2 {
      margin: 10px 0;
      font-size: 22px;
      color: #000;
    }

    .info-protected {
      display: inline-block;
      padding: 5px 10px;
      font-size: 14px;
      border-radius: 20px;
      background: linear-gradient(to right, #ffffff, #c0c0c0);
      color: #000;
      font-weight: 500;
      margin-bottom: 20px;
    }

    input[type="email"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #999;
      border-radius: 8px;
      background-color: #f7f7f7;
      font-size: 15px;
      box-sizing: border-box;
    }

    .password-container {
      position: relative;
      width: 100%;
      margin-bottom: 15px;
    }

    .password-container input {
      width: 100%;
      padding: 12px 40px 12px 12px;
      border: 1px solid #999;
      border-radius: 8px;
      background-color: #f7f7f7;
      font-size: 15px;
      box-sizing: border-box;
    }

    .password-container img {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      cursor: pointer;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: #000;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .btn-primary:hover {
      background: #333;
    }

    .divider {
      margin: 20px 0;
      border-top: 1px solid #999;
      position: relative;
    }

    .divider::after {
      content: "Registro Rápido Con";
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(to right, #ffffff, #c0c0c0);
      padding: 0 10px;
      font-size: 12px;
      color: #000;
      border-radius: 20px;
    }

    .social-icons {
      display: flex;
      justify-content: space-around;
      margin: 15px 0;
    }

    .social-icons img {
      width: 32px;
      height: 32px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .social-icons img:hover {
      transform: scale(1.1);
    }

    .location {
      font-size: 12px;
      color: #333;
      margin-top: 20px;
    }

    .terms {
      font-size: 11px;
      color: #555;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="modal">
    <img class="logo" src="A KIDPHONE2.0.png" alt="Logo Kidphone" />
    <h2>Regístrate/Inicia sesión</h2>
    <div class="info-protected">Con Protección De Datos ✔</div>

    <input type="email" id="email" placeholder="Email o Número de teléfono" required />

    <div class="password-container">
      <input type="password" id="password" placeholder="Contraseña" required />
      <img src="Ojoc2.PNG" id="togglePassword" onclick="togglePassword()" />
    </div>

    <button class="btn-primary" onclick="acceder()">Continuar</button>

    <div class="divider"></div>

    <div class="social-icons">
      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/apple.svg" />
      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/google.svg" />
      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/facebook.svg" />
      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/x.svg" />
    </div>

    <div class="location">🌍 Localización: <strong>Panamá</strong></div>

    <div class="terms">
      Al continuar aceptas nuestros términos.
    </div>
  </div>

<script>
async function acceder() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    alert("Por favor, completa todos los campos.");
    return;
  }

  try {
    const response = await fetch("https://commissarial-jerome-phenomenologically.ngrok-free.dev/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name: "Usuario Web",
        email: email,
        password: password
      })
    });

    const data = await response.json();

    if (response.ok) {
      alert(data.message || "Registro exitoso ✅");
    } else {
      alert("Error: " + (data.error || "Error desconocido"));
    }

  } catch (error) {
    console.error(error);
    alert("No se pudo conectar al servidor.");
  }
}

function togglePassword() {
  const passwordInput = document.getElementById("password");
  const toggleIcon = document.getElementById("togglePassword");

  if (passwordInput.type === "password") {
    passwordInput.type = "text";
    toggleIcon.src = "Ojoa1.PNG";
  } else {
    passwordInput.type = "password";
    toggleIcon.src = "Ojoc2.PNG";
  }
}
</script>

</body>
</html>
