<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registro / Inicio de sesión</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .modal {
      background: linear-gradient(to bottom right, #ffffff, #c0c0c0);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      width: 90%;
      max-width: 400px;
      padding: 30px 25px;
      text-align: center;
      position: relative;
      box-sizing: border-box;
    }

    .modal img.logo {
      width: 325px;
      max-width: 100%;
      height: auto;
      margin-bottom: 10px;
    }

    .tabs {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .tabs button {
      width: 48%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #ccc;
      font-weight: bold;
    }

    .tabs button.active {
      background: #000;
      color: #fff;
    }

    .info-protected {
      display: inline-block;
      padding: 5px 10px;
      font-size: 14px;
      border-radius: 20px;
      background: linear-gradient(to right, #ffffff, #c0c0c0);
      color: #000;
      font-weight: 500;
      margin-bottom: 20px;
    }

    input[type="email"], .password-container input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #999;
      border-radius: 8px;
      background-color: #f7f7f7;
      font-size: 15px;
      box-sizing: border-box;
    }

    .password-container {
      position: relative;
      width: 100%;
      margin-bottom: 15px;
    }

    .password-container img {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      cursor: pointer;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: #000;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-bottom: 10px;
    }

    .btn-primary:hover {
      background: #333;
    }

    .divider {
      margin: 20px 0;
      border-top: 1px solid #999;
      position: relative;
    }

    .divider::after {
      content: "Registro Rápido Con";
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(to right, #ffffff, #c0c0c0);
      padding: 0 10px;
      font-size: 12px;
      color: #000;
      border-radius: 20px;
    }

    .social-icons {
      display: flex;
      justify-content: space-around;
      margin: 15px 0;
    }

    .social-icons img {
      width: 32px;
      height: 32px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .social-icons img:hover {
      transform: scale(1.1);
    }

    .location {
      font-size: 12px;
      color: #333;
      margin-top: 20px;
    }

    .terms {
      font-size: 11px;
      color: #555;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="modal">
    <img class="logo" src="A KIDPHONE2.0.png" alt="Logo Kidphone" />

    <div class="tabs">
      <button id="btnLogin" class="active" onclick="cambiarModo('login')">Iniciar Sesión</button>
      <button id="btnRegister" onclick="cambiarModo('register')">Registrarse</button>
    </div>

    <div class="info-protected">Con Protección De Datos ✔</div>

    <input type="email" id="email" placeholder="Email o Número de teléfono" required />

    <div class="password-container">
      <input type="password" id="password" placeholder="Contraseña" required />
      <img src="Ojoc2.PNG" id="togglePassword" onclick="togglePassword()" />
    </div>

    <!-- Solo un botón Continuar debajo del logo (hereda login/registro) -->
    <button class="btn-primary" onclick="acceder()">Continuar</button>

    <div class="divider"></div>

    <div class="social-icons">
      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/apple.svg" />
      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/google.svg" />
      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/facebook.svg" />
      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/x.svg" />
    </div>

    <div class="location">🌍 Localización: <strong>Panamá</strong></div>

    <div class="terms">
      Al continuar aceptas nuestros términos.
    </div>
  </div>

<script>
let modo = "login";

// Verificar sesión al cargar la página y redirigir automáticamente
window.onload = async function() {
  const token = localStorage.getItem("token");
  const usuario = localStorage.getItem("usuario");

  if (token && usuario) {
    try {
      // Verificar token con el backend
      const response = await fetch(
        "https://symphonic-majesty-ruse.ngrok-free.dev",
        {
          headers: {
            Authorization: `Bearer ${token}`
          }
        }
      );

      if (response.ok) {
        // Token válido → redirigir al dashboard
        window.location.href = "dashboard.html";
      } else {
        // Token inválido → limpiar storage
        localStorage.removeItem("token");
        localStorage.removeItem("usuario");
      }
    } catch (err) {
      console.error("Error verificando token:", err);
      localStorage.removeItem("token");
      localStorage.removeItem("usuario");
    }
  }
};

function cambiarModo(nuevoModo) {
  modo = nuevoModo;
  const btnLogin = document.getElementById("btnLogin");
  const btnRegister = document.getElementById("btnRegister");

  if (modo === "login") {
    btnLogin.classList.add("active");
    btnRegister.classList.remove("active");
  } else {
    btnRegister.classList.add("active");
    btnLogin.classList.remove("active");
  }
}

// Función que maneja login o registro según el modo activo
async function acceder() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    alert("Por favor, completa todos los campos.");
    return;
  }

  const endpoint = modo === "login" ? "login" : "register";

  try {
    const response = await fetch(
      `https://symphonic-majesty-ruse.ngrok-free.dev`,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: "Usuario Web",
          email: email,
          password: password
        })
      }
    );

    const data = await response.json();

    if (response.ok) {
      if (modo === "login") {
        // 🔑 Guardar token JWT
        localStorage.setItem("token", data.token);
        localStorage.setItem("usuario", JSON.stringify(data.user));
        // Redirigir automáticamente al dashboard
        window.location.href = "dashboard.html";
      } else {
        alert(data.message || "Registro exitoso ✅");
      }
    } else {
      alert("Error: " + (data.error || "Error desconocido"));
    }
  } catch (error) {
    console.error(error);
    alert("No se pudo conectar al servidor.");
  }
}

// Función para acceder a rutas protegidas usando el token
async function accederDashboard() {
  const token = localStorage.getItem("token");
  if (!token) {
    alert("No tienes token, inicia sesión primero.");
    return;
  }

  try {
    const response = await fetch(
      "https://symphonic-majesty-ruse.ngrok-free.dev",
      {
        headers: {
          Authorization: `Bearer ${token}`
        }
      }
    );

    const data = await response.json();
    if (response.ok) {
      console.log("Dashboard:", data);
      alert("Bienvenido al dashboard 🔐");
    } else {
      alert("Error: " + (data.error || "Token inválido"));
    }
  } catch (err) {
    console.error(err);
    alert("Error al conectar con el servidor.");
  }
}

function togglePassword() {
  const passwordInput = document.getElementById("password");
  const toggleIcon = document.getElementById("togglePassword");

  if (passwordInput.type === "password") {
    passwordInput.type = "text";
    toggleIcon.src = "Ojoa1.PNG";
  } else {
    passwordInput.type = "password";
    toggleIcon.src = "Ojoc2.PNG";
  }
}
</script>

</body>
</html>
